project: qsr-synth-data-generator
mode: incremental
feature_description: >
  OTel Live-Order Bolt-On. Blend real PizzaTel storefront orders (jmrdemo.zerobus.otel_logs +
  otel_spans) into the synthetic pipeline as a graceful, best-effort bolt-on (Pattern B): a
  pure reshape adapter + a Databricks notebook that reads OTel, reshapes to the order_events
  envelope, and APPENDS to staging.order_events (append-only, high-water-mark idempotent) with
  an internal source='otel' discriminator. Real orders flow seamlessly through the existing,
  UNCHANGED silver/gold/Genie path. Must match the project deployment standard: DAB-managed
  refresh job in resources/, initial_otel_backfill task in setup_job.yml, destroy_job coverage
  (DAB destroy + preserved staging; no unsafe deletes). Mirrors the weather-events bolt-on.
  Plan: docs/superpowers/plans/2026-07-14-otel-live-order-bolt-on.md
previous_manifest: .agent-team/team-manifest.previous.yaml
branch: feat/otel-live-order-bolt-on

plan_files:
  - docs/superpowers/plans/2026-07-14-otel-live-order-bolt-on.md

project_snapshot:
  structure:
    src_dirs:
      - src/generator/           # entity_registry, runner, demand_model, causal_context, id_utils, main.py, domains/
      - src/pipeline/            # mvm_pipeline.py — Lakeflow Declarative Pipelines (silver + gold)
      - src/setup/               # setup_notebook, destroy_notebook, create_metric_views, build_genie_spaces, ...
      - src/refresh/             # weather/events bolt-on clients + refresh notebook (OTel adapter joins here)
      - src/features/            # customer/store feature tables
      - src/ml/                  # recommender training
      - src/agent/               # commerce agent
    resources:
      - resources/setup_job.yml       # multi-task setup DAG (incl. initial_weather_refresh)
      - resources/generator_job.yml   # hourly live generator cron
      - resources/pipeline.yml        # Lakeflow DLT pipeline resource
      - resources/destroy_job.yml     # teardown job (destroy_notebook.py; staging preserved)
      - resources/refresh_weather_events.yml  # daily weather/events refresh job (bolt-on precedent)
      - resources/feature_refresh_job.yml     # weekly feature refresh
    tests:
      - tests/test_refresh.py         # weather-events hermetic tests (pattern precedent)
      - tests/test_runner.py          # exercises backfill_ticks (NOT write_batch)
      - tests/test_orders.py          # domain generator tests (unaffected)
      - "~118 collected items total (baseline)"
    dab_config:
      bundle: qsr-synth-data-generator
      targets: [dev (mode:development, default), prod (mode:production, profile:aws)]
      variables: [catalog_name, num_units, backfill_months, live_tick_seconds,
                  base_orders_per_unit_per_hour, start_dt_override, schema_prefix,
                  weather_refresh_cron, ticketmaster_secret_scope, seatgeek_secret_scope, ...]
  history:
    original_team: full build (foundation, domains, DLT, setup/resources, qa, deploy)
    previous_feature: weather-events-phase3 (real weather/events → CausalContext; daily DAB refresh) — complete
    introspection: >
      CLAUDE.md Introspection documents the weather-events bolt-on (Phase 1) — this feature is
      its structural twin. Key learned patterns: best-effort external reads with [WARN] logging;
      graceful degradation (return []/{} on missing source); DAB task graph extension inserts the
      initial refresh before backfill; disjoint file ownership between data + deploy engineers.
    contracts: [weather-events-phase3, governance-pack, and foundation/domain/setup/qa contracts]
    known_issues: []
  architecture:
    data_tables:
      - "{catalog}.{prefix}staging.order_events  (wide streaming staging table — BOLT-ON SEAM; +source col)"
      - "{catalog}.{prefix}silver.*   (guest_order, order_item, payment, status_event, delivery_order, ... — UNCHANGED)"
      - "{catalog}.{prefix}ref.unit   (store→unit mapping pool; has unit_id/state, no zip)"
      - "{catalog}.{prefix}metrics.*  (order_performance etc. — consume silver, UNCHANGED)"
      - "jmrdemo.zerobus.otel_logs / otel_spans  (EXTERNAL source; best-effort read)"
    endpoints: []
    app_routes: []
    frontend_pages: []
  capabilities:
    new: []
    extension: [data-ingestion, data-transformation, etl, deployment]
    unchanged: [streaming, ml-training, ml-serving, feature-engineering, genai-rag,
                llm-integration, web-app, api-backend, frontend]

agents:
  - name: otel-order-data-engineer
    type: dynamic
    registered_agent: .agent-team/agents/otel-order-data-engineer.md
    model: sonnet
    phase: 1
    parallel_group: implementation
    tasks: [adapter, notebook, fixtures, tests, write_batch-source-default]

  - name: otel-order-deploy-engineer
    type: dynamic
    registered_agent: .agent-team/agents/otel-order-deploy-engineer.md
    model: sonnet
    phase: 1
    parallel_group: implementation
    tasks: [refresh_otel_orders.yml, setup_job.yml, databricks.yml, staging-source-ddl, destroy-doc]

  - name: qa-engineer
    type: curated
    registered_agent: agents/qa-engineer.md
    model: sonnet
    phase: 2
    parallel_group: qa

phases:
  - id: 1
    name: otel-live-orders-implementation
    description: >
      Parallel: data-engineer implements the pure reshape adapter, the best-effort refresh
      notebook, hermetic tests + fixtures, and the write_batch source default. deploy-engineer
      wires the DAB refresh job, the initial_otel_backfill setup task, the staging source column,
      databricks.yml vars, and confirms/documents destroy_job coverage. Disjoint file sets — no
      merge conflict. mvm_pipeline.py is intentionally left UNCHANGED (seamless downstream).
    agents: [otel-order-data-engineer, otel-order-deploy-engineer]
    parallel_groups: [[otel-order-data-engineer, otel-order-deploy-engineer]]

  - id: 2
    name: qa
    description: >
      Validate: python3 -m pytest -q — full baseline suite unchanged + new test_otel_adapter
      tests, zero failures. databricks bundle validate -p DEFAULT passes. Contract compliance:
      graceful-empty, positive-price, SKU clamp, namespaced ID bridge, setup_job DAG, staging
      source col, refresh job schedule, databricks.yml vars, mvm_pipeline.py UNCHANGED.
    agents: [qa-engineer]
    parallel_groups: [[qa-engineer]]
    depends_on: [1]
