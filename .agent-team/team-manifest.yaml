project: qsr-synth-data-generator
mode: incremental
feature_description: >
  Phase 3 — Weather & Local Events Integration. Populate ref.weather_conditions and
  ref.local_events with real automated data from Open-Meteo (forecasts), NOAA NWS (alerts),
  Nager.Date (holidays), Ticketmaster, and SeatGeek (events). Wire the lookup into
  CausalContext so the demand model produces weather- and event-driven order volume.
  Add a demand_risk_forecast metric view for Genie. Daily DAB refresh job.
  Plan: docs/superpowers/plans/2026-05-22-weather-events-phase3.md
previous_manifest: .agent-team/team-manifest.previous.yaml
branch: feat/weather-events-phase3

plan_files:
  - docs/superpowers/plans/2026-05-22-weather-events-phase3.md

project_snapshot:
  structure:
    src_dirs:
      - src/generator/domains/   # order, inventory, loyalty, guest, workforce generators
      - src/generator/reference/ # us_locations, seeder, menu_catalog
      - src/generator/           # entity_registry, runner, demand_model, entropy, causal_context, id_utils, main.py
      - src/pipeline/            # mvm_pipeline.py — Lakeflow Declarative Pipelines (14 silver + 4 gold)
      - src/setup/               # setup_notebook, destroy_notebook, start_pipeline, unpause_generator,
                                 # create_metric_views, create_genie_space, apply_governance, configure_monitoring
      - src/refresh/             # NEW — weather/events API clients + refresh notebook
    resources:
      - resources/setup_job.yml       # 9-task DAG (incl. apply_governance, configure_monitoring)
      - resources/generator_job.yml   # Hourly live generator cron job
      - resources/pipeline.yml        # Lakeflow DLT pipeline resource
      - resources/destroy_job.yml     # Teardown job
      - resources/refresh_weather_events.yml  # NEW — daily weather/events refresh job
    tests:
      - tests/test_orders.py
      - tests/test_inventory.py
      - tests/test_guest_loyalty_workforce.py
      - tests/test_runner.py
      - tests/test_seeder.py
      - tests/test_entity_registry.py
      - tests/test_demand_model.py
      - tests/test_causal_context.py
      - tests/test_entropy.py
      - tests/test_us_locations.py
      - tests/test_smoke.py
      - tests/test_menu_catalog.py
      - tests/test_refresh.py         # NEW
    dab_config:
      bundle: qsr-synth-data-generator
      targets: [dev (mode:development, default), prod (mode:production, profile:aws)]
      variables: [catalog_name, num_units, backfill_months, live_tick_seconds,
                  base_orders_per_unit_per_hour, start_dt_override, schema_prefix,
                  weather_refresh_cron, ticketmaster_secret_scope, seatgeek_secret_scope]
  history:
    previous_feature: governance-pack (ABAC, row filters, column masks, monitors — complete)
    known_issues: []
  architecture:
    data_tables:
      - "{catalog}.{prefix}staging.*  (14 streaming staging tables)"
      - "{catalog}.{prefix}silver.*   (14 silver tables via DLT)"
      - "{catalog}.{prefix}ref.*      (unit, franchisee, menu_item, recipe_ingredient, financial_period,
                                       supplier, weather_conditions [stub→real], local_events [stub→real])"
      - "{catalog}.{prefix}metrics.*  (5 existing views + demand_risk_forecast [NEW])"
    endpoints: []
    app_routes: []
    frontend_pages: []
  capabilities:
    new: [data-ingestion, etl]
    extension: [data-transformation, deployment]
    unchanged: [streaming, ml-training, ml-serving, genai-rag, web-app, api-backend, frontend]

agents:
  - name: weather-events-data-engineer
    type: dynamic
    registered_agent: .agent-team/agents/weather-events-data-engineer.md
    model: sonnet
    phase: 1
    parallel_group: implementation
    tasks: [1, 2, 3, 4, 5, 6, 7, 8, 9-notebook, 10, 11]

  - name: weather-events-deploy-engineer
    type: dynamic
    registered_agent: .agent-team/agents/weather-events-deploy-engineer.md
    model: sonnet
    phase: 1
    parallel_group: implementation
    tasks: [9-dab-yaml]

  - name: qa-engineer
    type: curated
    registered_agent: agents/qa-engineer.md
    model: sonnet
    phase: 2
    parallel_group: qa

phases:
  - id: 1
    name: weather-events-implementation
    description: >
      Parallel: data-engineer implements all new Python clients + CausalContext integration
      + metric view + docs. deploy-engineer wires DAB YAML (refresh job, setup_job.yml task,
      databricks.yml variables). They operate on disjoint file sets so no merge conflict.
    agents: [weather-events-data-engineer, weather-events-deploy-engineer]
    parallel_groups: [[weather-events-data-engineer, weather-events-deploy-engineer]]

  - id: 2
    name: qa
    description: >
      Validate: pytest must show 75+ tests all passing (new tests in test_seeder,
      test_causal_context, test_refresh). Bundle validate must pass. Contract compliance check.
    agents: [qa-engineer]
    parallel_groups: [[qa-engineer]]
    depends_on: [1]
