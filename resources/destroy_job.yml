resources:
  jobs:
    destroy_job:
      name: "QSR Destroy [${bundle.target}]"
      tags:
        project: qsr-synth-data-generator
      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - pyyaml
              # Step 0h drops the online feature tables + Lakebase online store via
              # FeatureEngineeringClient (drop_online_table / delete_online_store /
              # delete_feature_spec). On serverless this package is NOT pre-installed, so
              # without it the FE import raises ImportError, the try/except swallows it as
              # a [WARN], and the billable online store + *_online tables are left behind —
              # which then breaks the next deploy with "Destination table ..._online already
              # exists". Declaring it here lets the teardown actually execute.
              - databricks-feature-engineering
      tasks:
        - task_key: destroy
          environment_key: default
          notebook_task:
            notebook_path: ../src/setup/destroy_notebook.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_prefix: ${var.schema_prefix}
              ontos_app_url: ${var.ontos_app_url}
              ontos_enabled: ${var.ontos_enabled}
