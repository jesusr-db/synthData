resources:
  jobs:
    setup_job:
      name: "QSR Setup [${bundle.target}]"
      tags:
        project: qsr-synth-data-generator
      environments:
        - environment_key: generator
          spec:
            client: "1"
            dependencies:
              - faker>=20.0.0
        - environment_key: refresh
          spec:
            client: "1"
            dependencies:
              - requests
              - pyyaml
        - environment_key: ml
          spec:
            client: "2"
            dependencies:
              - databricks-feature-engineering
              - scikit-learn
              - joblib
              - pandas
              - pyyaml
              # build_commerce_agent logs a ResponsesAgent whose load_context builds the
              # SDK OpenAI client (mlflow invokes load_context during log validation).
              - databricks-sdk[openai]
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../src/setup/setup_notebook.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              num_units: ${var.num_units}
              schema_prefix: ${var.schema_prefix}

        - task_key: initial_weather_refresh
          depends_on:
            - task_key: setup
          environment_key: refresh
          notebook_task:
            notebook_path: ../src/refresh/refresh_notebook.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_prefix: ${var.schema_prefix}
              ticketmaster_secret_scope: ${var.ticketmaster_secret_scope}
              ticketmaster_secret_key: "ticketmaster_consumer_key"
              seatgeek_secret_scope: ${var.seatgeek_secret_scope}
              seatgeek_secret_key: "seatgeek_client_id"

        - task_key: start_pipeline
          depends_on:
            - task_key: backfill
          notebook_task:
            notebook_path: ../src/setup/start_pipeline_notebook.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_prefix: ${var.schema_prefix}

        - task_key: build_feature_tables
          depends_on:
            - task_key: start_pipeline
          notebook_task:
            notebook_path: ../src/setup/build_feature_tables.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_prefix: ${var.schema_prefix}
          environment_key: ml

        - task_key: train_recommender
          depends_on:
            - task_key: build_feature_tables
          notebook_task:
            notebook_path: ../src/ml/train_recommender.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_prefix: ${var.schema_prefix}
              recommender_query_principal: ${var.recommender_query_principal}
          environment_key: ml

        - task_key: build_commerce_agent
          depends_on:
            - task_key: train_recommender
          notebook_task:
            notebook_path: ../src/setup/build_commerce_agent.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_prefix: ${var.schema_prefix}
              agent_llm_model: ${var.agent_llm_model}
              llm_gateway_name: ${var.llm_gateway_name}
              commerce_agent_query_principal: ${var.commerce_agent_query_principal}
          environment_key: ml

        - task_key: create_metric_views
          depends_on:
            - task_key: start_pipeline
          notebook_task:
            notebook_path: ../src/setup/create_metric_views.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_prefix: ${var.schema_prefix}

        - task_key: create_genie_space
          depends_on:
            - task_key: create_metric_views
          notebook_task:
            notebook_path: ../src/setup/create_genie_space.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_prefix: ${var.schema_prefix}

        - task_key: apply_governance
          depends_on:
            - task_key: start_pipeline
          notebook_task:
            notebook_path: ../src/setup/apply_governance.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_prefix: ${var.schema_prefix}

        - task_key: configure_monitoring
          depends_on:
            - task_key: apply_governance
          notebook_task:
            notebook_path: ../src/setup/configure_monitoring.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_prefix: ${var.schema_prefix}

        - task_key: apply_ontos
          depends_on:
            - task_key: configure_monitoring
          environment_key: refresh
          notebook_task:
            notebook_path: ../src/setup/apply_ontos.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_prefix: ${var.schema_prefix}
              ontos_app_url: ${var.ontos_app_url}
              ontos_enabled: ${var.ontos_enabled}

        - task_key: backfill
          depends_on:
            - task_key: setup
            - task_key: initial_weather_refresh
          environment_key: generator
          notebook_task:
            notebook_path: ../src/generator/main.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              num_units: ${var.num_units}
              backfill_months: ${var.backfill_months}
              live_tick_seconds: ${var.live_tick_seconds}
              base_orders_per_unit_per_hour: ${var.base_orders_per_unit_per_hour}
              start_dt_override: ${var.start_dt_override}
              schema_prefix: ${var.schema_prefix}
              mode: backfill

        - task_key: unpause_generator
          depends_on:
            - task_key: backfill
            - task_key: create_genie_space
            - task_key: apply_ontos
            - task_key: train_recommender
            - task_key: build_commerce_agent
          notebook_task:
            notebook_path: ../src/setup/unpause_generator_notebook.py
            base_parameters:
              generator_job_id: ${resources.jobs.generator_job.id}
