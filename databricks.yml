bundle:
  name: qsr-synth-data-generator

variables:
  catalog_name:
    default: jmrdemo
  num_units:
    default: "250"
  backfill_months:
    default: "1"
  live_tick_seconds:
    default: "60"
    description: "Sub-tick granularity (seconds) within each hourly live run. 60 = one sub-tick per minute, matching per-minute historical cadence."
  base_orders_per_unit_per_hour:
    default: "18"
  start_dt_override:
    default: ""
    description: "Backfill window start (ISO datetime, e.g. 2026-05-19T00:00:00). Empty string = use staging MAX(event_ts) or backfill_months default."
  schema_prefix:
    default: "synth_"
    description: "Prefix for all Unity Catalog schemas (e.g. 'synth_' → synth_staging, synth_silver, synth_ref, synth_metrics). Use empty string for no prefix."
  weather_refresh_cron:
    default: "0 0 5 * * ?"
    description: "Quartz cron for daily weather/events refresh job (default 05:00 UTC)."
  ticketmaster_secret_scope:
    default: "qsr-synth"
    description: "Databricks secret scope containing ticketmaster_consumer_key. Leave default if not using Ticketmaster."
  seatgeek_secret_scope:
    default: "qsr-synth"
    description: "Databricks secret scope containing seatgeek_client_id. Leave default if not using SeatGeek."
  ontos_app_url:
    default: "https://ontos-7405605519549535.15.azure.databricksapps.com"
    description: "Base URL of the deployed ontos Databricks App."
  ontos_enabled:
    default: "true"
    description: "Set to 'false' to skip ontos configuration steps in setup/destroy."
  features_enabled:
    default: "true"
    description: "Set to 'false' to skip feature store + recommender setup/destroy steps."
  feature_refresh_cron:
    default: "0 0 6 ? * SUN"
    description: "Quartz cron for weekly feature-table refresh (default Sundays 06:00 UTC)."
  recommender_query_principal:
    default: ""
    description: "Service principal name (or user PAT principal) granted CAN_QUERY on the recommender endpoint so PizzaTel can call it. Empty = skip the grant."
  commerce_agent_query_principal:
    description: SP/principal granted CAN_QUERY on the commerce agent endpoint. Empty = skip grant.
    default: ""
  agent_llm_model:
    description: Foundation-model endpoint used when llm_gateway_name is empty (in-place AI Gateway on the FM endpoint).
    default: databricks-claude-sonnet-4-5
  llm_gateway_name:
    description: Standalone Unity AI Gateway name for the agent's LLM (e.g. jmr_gateway). Empty = use agent_llm_model FM endpoint instead.
    default: jmr_gateway

workspace:
  profile: DEFAULT

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: DEFAULT
  prod:
    mode: production
    workspace:
      profile: aws

include:
  - resources/*.yml
